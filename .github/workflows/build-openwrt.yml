name: Build Cudy TR3600 OpenWrt with Passwall

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3

      - name: Clone Source Code
        run: |
          # Pull the developer branch that contains Cudy TR3600 v1 support.
          git clone -b agent/cudy-tr3600-v1-6.12 --single-branch https://github.com/soapmancn/openwrt.git openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config
        run: |
          cd openwrt
          cat <<'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          EOF
          make defconfig
          echo '=== Selected target ==='
          grep '^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y' .config || true
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y$' .config

      - name: Download Package Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Verify TR3600 Firmware
        run: |
          cd openwrt
          echo '=== TR3600 build outputs ==='
          ls -lh bin/targets/mediatek/filogic/*cudy_tr3600-v1*
          test -n "$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*cudy_tr3600-v1*sysupgrade*' -print -quit)"

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-Firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*cudy_tr3600-v1*
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
          if-no-files-found: error
